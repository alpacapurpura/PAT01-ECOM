services:
  # MySQL Database (Production)
  mysql:
    image: mariadb:10.11
    container_name: wp_mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
    #command: >
    #  --character-set-server=utf8mb4
    #  --collation-server=utf8mb4_unicode_ci
    #  --innodb-buffer-pool-size=512M
    #  --max-connections=200
    #  --innodb-log-file-size=256M
    #  --query-cache-size=64M
    #  --query-cache-type=1

  # WordPress Application (Production)
  wordpress:
    image: wordpress:6.8.2-php8.1-apache
    container_name: wp_app_prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # ports:
    #    - "${WORDPRESS_PORT:-80}:80"
    environment:
      # Database Configuration
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}

      # WordPress Configuration
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_a4b7_}
      WORDPRESS_DEBUG: false

      # Production Configuration
      WORDPRESS_CONFIG_EXTRA: |
        // WordPress URLs para Producción
        define('WP_HOME', '${WORDPRESS_URL:-https://andessuyo.com}');
        define('WP_SITEURL', '${WORDPRESS_URL:-https://andessuyo.com}');

        // Security Settings
        define('DISALLOW_FILE_EDIT', true);
        define('DISALLOW_FILE_MODS', false); // Cambiar a false solo cuando se haga pase a producción. Debe estar siempre en true 
        define('WP_DEBUG', false);
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);

        // Cache Settings
        define('WP_CACHE', true);
        define('WP_POST_REVISIONS', 3);
        define('AUTOSAVE_INTERVAL', 300);
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/themes:/var/www/html/wp-content/themes
      - ./wordpress/plugins:/var/www/html/wp-content/plugins
      - ./wordpress/languages:/var/www/html/wp-content/languages
      - ./docker/entrypoint.sh:/entrypoint.sh
    # COMANDO TEMPORAL COMENTADO PARA PRIMERA INSTALACIÓN
    # Descomenta este comando SOLO después de que WordPress esté completamente instalado
    # y necesites corregir permisos de archivos existentes
    command: /entrypoint.sh
    networks:
      - wordpress_network
      - web_gateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_gateway"

      # --- 1. Definir el enrutador principal para HTTPS ---
      - "traefik.http.routers.wordpress.rule=Host(`andessuyo.com`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls.certresolver=letsencrypt"

      # --- 2. Conectar el enrutador al servicio correcto ---
      - "traefik.http.routers.wordpress.service=wordpress-service"

      # --- 3. Definir el servicio y a qué puerto del contenedor apunta ---
      - "traefik.http.services.wordpress-service.loadbalancer.server.port=80"

      # --- 4. (Opcional) Asignar middlewares al enrutador ---
      #- "traefik.http.routers.wordpress.middlewares=wordpress-headers"
      #- "traefik.http.middlewares.wordpress-headers.headers.customrequestheaders.X-Forwarded-Proto=https"

    #healthcheck:
    #  test: ["CMD", "curl", "-f", "http://localhost:80/wp-admin/install.php"]
    #  interval: 30s
    #  timeout: 10s
    #  retries: 5

  cron:
    build:
      context: .
      dockerfile: cron.Dockerfile
    container_name: wp_cron
    restart: unless-stopped
    init: true
    volumes:
      # Montar el socket de Docker para que este contenedor pueda controlar otros
      - /var/run/docker.sock:/var/run/docker.sock
      # Montar el directorio del proyecto para acceder a .env y docker-compose.yml
      - .:/app
    working_dir: /app
    networks:
      - wordpress_network
volumes:
  mysql_data:
    driver: local
  wordpress_data:  # AGREGAR ESTA LÍNEA
    driver: local

networks:
  wordpress_network:
    driver: bridge
  web_gateway:
    external: true