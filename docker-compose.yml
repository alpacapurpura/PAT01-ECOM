services:
  mysql:
    image: mariadb:10.11
    container_name: wp_mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "7"
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./wordpress/logs/mysql:/var/log/mysql
      - ./mysql/mysql-logging.cnf:/etc/mysql/conf.d/mysql-logging.cnf:ro
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10

  wordpress-dev:
    image: wordpress:6.8.2-php8.1-apache
    container_name: wp_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Eliminar la sección ports completamente cuando uses Traefik
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "7"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TIMEZONE}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WP_DEBUG}
      WORDPRESS_CONFIG_EXTRA: ${WORDPRESS_CONFIG_EXTRA}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress:/var/www/html/wp-content
      - ./wordpress/logs:/var/www/html/wp-content/logs
    networks:
      - wordpress_network
      - web_gateway_local  # ✅ Ya está correcto
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.wordpress.entrypoints=web"
      - "traefik.http.routers.wordpress.service=wordpress-service"
      - "traefik.http.services.wordpress-service.loadbalancer.server.port=80"
      - "traefik.docker.network=web_gateway_local"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]  # ✅ Mejor usar la raíz
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - development

  wordpress-prod:
    image: wordpress:6.8.2-php8.1-apache
    container_name: wp_app_prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "7"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TIMEZONE}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
      WORDPRESS_DEBUG: 0
      WORDPRESS_CONFIG_EXTRA: ${WORDPRESS_CONFIG_EXTRA}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/themes:/var/www/html/wp-content/themes
      - ./wordpress/plugins:/var/www/html/wp-content/plugins
      - ./wordpress/languages:/var/www/html/wp-content/languages
      - ./wordpress/logs:/var/www/html/wp-content/logs
    networks:
      - wordpress_network
      - web_gateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_gateway"

      # --- Router HTTPS (Puerto 443) ---
      # Cambiamos el nombre a 'wp-prod-secure' para evitar conflictos
      - "traefik.http.routers.wp-prod-secure.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.wp-prod-secure.entrypoints=websecure"
      - "traefik.http.routers.wp-prod-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wp-prod-secure.service=wp-prod-service"

      # --- Router HTTP (Puerto 80 - Redirección) ---
      # Este router captura el tráfico http y lo manda al middleware que vi en tu foto
      - "traefik.http.routers.wp-prod-http.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.wp-prod-http.entrypoints=web"
      - "traefik.http.routers.wp-prod-http.middlewares=redirect-to-https@docker"
      - "traefik.http.routers.wp-prod-http.service=wp-prod-service"

      # --- Servicio (Backend) ---
      - "traefik.http.services.wp-prod-service.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - production

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: wp_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 20M
    networks:
      - wordpress_network
      - web_gateway_local
    profiles:
      - development
    labels:
      - "traefik.enable=true"
      # Define la URL para acceder (puedes cambiar 'pma.local' si quieres)
      - "traefik.http.routers.pma.rule=Host(`pma.192.168.18.190.nip.io`)"
      # Usa el mismo punto de entrada 'web' (puerto 80)
      - "traefik.http.routers.pma.entrypoints=web"
      # Define el servicio interno de Traefik
      - "traefik.http.routers.pma.service=pma-service"
      # Apunta al puerto interno 80 del contenedor de phpmyadmin
      - "traefik.http.services.pma-service.loadbalancer.server.port=80"
      # ¡La corrección clave! Especifica la red que Traefik debe usar.
      - "traefik.docker.network=web_gateway_local"

volumes:
  mysql_data:
  wordpress_data:

networks:
  wordpress_network:
  web_gateway:
    external: true
  web_gateway_local:
    external: true